<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Inicio</a></li>
        <li class="breadcrumb-item"><a href="#">Administración</a></li>
        <li class="breadcrumb-item active" aria-current="page">Usuarios</li>
      </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Mantenimiento de Usuarios</h2>
      <button type="button" class="btn btn-primary">
        Solicitudes Pendientes <span class="badge bg-danger">3</span>
      </button>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">

      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Carlos Pérez</h5>
            <p class="card-text text-muted">Rol: Administrador</p>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-primary">Ver</button>
              <button type="button" class="btn btn-outline-warning">Editar</button>
              <button type="button" class="btn btn-outline-danger">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Ana Gómez</h5>
            <p class="card-text text-muted">Rol: Editor</p>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-primary">Ver</button>
              <button type="button" class="btn btn-outline-warning">Editar</button>
              <button type="button" class="btn btn-outline-danger">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Luis Ramírez</h5>
            <p class="card-text text-muted">Rol: Vendedor</p>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-primary">Ver</button>
              <button type="button" class="btn btn-outline-warning">Editar</button>
              <button type="button" class="btn btn-outline-danger">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">María Torres</h5>
            <p class="card-text text-muted">Rol: Soporte</p>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-primary">Ver</button>
              <button type="button" class="btn btn-outline-warning">Editar</button>
              <button type="button" class="btn btn-outline-danger">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
